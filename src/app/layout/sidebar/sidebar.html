<aside class="flex min-h-full w-64 flex-col border-r border-slate-200 bg-white">

    <!-- Navegación -->
    <nav class="flex-1 px-3 py-5">

        <!-- Principal -->
        <div class="mb-3 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
            Principal
        </div>

        <div class="space-y-1">

            <!-- Dashboard -->
            <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-700 font-medium"
                [routerLinkActiveOptions]="{ exact: true }"
                class="group relative flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
                <span routerLinkActive="bg-blue-600" [routerLinkActiveOptions]="{ exact: true }"
                    class="absolute left-0 h-6 w-0.5 rounded-r-full"></span>

                <mat-icon class="text-[21px] text-slate-400 transition-colors group-hover:text-slate-600"
                    routerLinkActive="text-blue-600" [routerLinkActiveOptions]="{ exact: true }">
                    dashboard
                </mat-icon>

                <span>Dashboard</span>
            </a>


            <!-- Clientes -->
            <a routerLink="/clients" routerLinkActive="bg-blue-50 text-blue-700 font-medium"
                class="group relative flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
                <span routerLinkActive="bg-blue-600" class="absolute left-0 h-6 w-0.5 rounded-r-full"></span>

                <mat-icon class="text-[21px] text-slate-400 transition-colors group-hover:text-slate-600"
                    routerLinkActive="text-blue-600">
                    people
                </mat-icon>

                <span>Clientes</span>
            </a>


            <!-- Operaciones -->
            <a routerLink="/operations" routerLinkActive="bg-blue-50 text-blue-700 font-medium"
                class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
                <mat-icon class="text-[21px] text-slate-400 transition-colors group-hover:text-slate-600">
                    assignment
                </mat-icon>

                <span>Operaciones</span>
            </a>

        </div>


        <!-- Gestión -->
        <div class="mb-3 mt-8 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
            Gestión
        </div>

        <div class="space-y-1">

            <!-- Documentación -->
            <a routerLink="/documentation" routerLinkActive="bg-blue-50 text-blue-700 font-medium"
                class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
                <mat-icon class="text-[21px] text-slate-400 transition-colors group-hover:text-slate-600">
                    description
                </mat-icon>

                <span>Documentación</span>
            </a>


            <!-- Configuración -->
            <a href="#"
                class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
                <mat-icon class="text-[21px] text-slate-400 transition-colors group-hover:text-slate-600">
                    settings
                </mat-icon>

                <span>Configuración</span>
            </a>

        </div>

    </nav>


    <!-- Parte inferior -->
    <div class="border-t border-slate-200 px-6 py-4">

        <div class="flex items-center justify-between">

            <div>
                <div class="text-xs font-medium text-slate-600">
                    CRM Banking
                </div>

                <div class="mt-0.5 text-[11px] text-slate-400">
                    Plataforma de gestión
                </div>
            </div>

            <span class="rounded-md bg-slate-100 px-2 py-1 text-[10px] font-medium text-slate-500">
                v1.0.0
            </span>

        </div>

    </div>

</aside>
