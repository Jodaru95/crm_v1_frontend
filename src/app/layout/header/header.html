<header class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-6">

    <!-- Logo / nombre de la aplicación -->
    <div class="flex items-center gap-3">

        <!-- Logo -->
        <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-sm font-bold text-white shadow-sm">
            C
        </div>

        <!-- Nombre -->
        <div>
            <h1 class="text-base font-semibold leading-none text-slate-800">
                CRM Banking
            </h1>

            <span class="text-xs text-slate-500">
                Gestión de clientes
            </span>
        </div>

    </div>


    <!-- Zona derecha -->
    <div class="flex items-center gap-2">

        <!-- Notificaciones -->
        <button mat-icon-button aria-label="Notificaciones"
            class="text-slate-500 transition-colors hover:text-blue-600">
            <mat-icon>notifications_none</mat-icon>
        </button>


        <!-- Separador -->
        <div class="mx-1 h-7 w-px bg-slate-200"></div>


        <!-- Usuario -->
        <button mat-button class="flex items-center gap-2 !min-w-0 !px-2">

            <!-- Avatar -->
            <div
                class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-700 ring-1 ring-blue-100">
                JD
            </div>

            <!-- Información usuario -->
            <div class="hidden text-left sm:block">
                <div class="text-sm font-medium leading-tight text-slate-800">
                    John Doe
                </div>

                <div class="text-xs leading-tight text-slate-500">
                    Gestor
                </div>
            </div>

            <mat-icon class="text-slate-400">
                expand_more
            </mat-icon>

        </button>

    </div>

</header>
