<header class="h-16 border-b bg-white flex items-center justify-between px-6">
    <!-- Logo / nombre de la aplicación -->
    <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-blue-600 text-white font-bold">
            C
        </div>

        <div>
            <h1 class="text-lg font-semibold text-gray-900 leading-none">
                CRM Banking
            </h1>

            <span class="text-xs text-gray-500">
                Gestión de clientes
            </span>
        </div>
    </div>

    <!-- Zona derecha -->
    <div class="flex items-center gap-3">

        <!-- Notificaciones -->
        <button mat-icon-button aria-label="Notificaciones">
            <mat-icon>notifications</mat-icon>
        </button>

        <!-- Usuario -->
        <button mat-button class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-semibold">
                JD
            </div>

            <div class="text-left hidden sm:block">
                <div class="text-sm font-medium text-gray-900">
                    John Doe
                </div>

                <div class="text-xs text-gray-500">
                    Gestor
                </div>
            </div>

            <mat-icon>expand_more</mat-icon>
        </button>

    </div>
</header>
